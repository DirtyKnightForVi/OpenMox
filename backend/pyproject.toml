[project]
name = "openmox-backend"
version = "0.1.0"
description = "OpenMox — Enterprise Multi-Agent Collaborative Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0",
    # ── AgentScope runtime dependencies (no agentscope itself) ──
    # These are extracted from agentscope's pyproject.toml [project] dependencies
    # plus transitive imports discovered during integration.
    "openai>=1.68.0",
    "httpx>=0.28.0",
    "jsonschema>=4.23.0",
    "pydantic>=2.10.0",
    "aioitertools>=0.12.0",
    "json_repair>=0.30.0",
    "shortuuid>=1.0.0",
    "aiofiles>=24.0.0",
    "requests>=2.31.0",
    "numpy>=2.0.0",
    "mcp>=1.0.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-bash>=0.23.0",
    "python-frontmatter>=1.1.0",
    "jinja2>=3.1.0",
    "docstring-parser>=0.16.0",
    "opentelemetry-api>=1.39.0",
    "opentelemetry-sdk>=1.39.0",
    "opentelemetry-exporter-otlp>=1.39.0",
    "opentelemetry-semantic-conventions>=0.60b0",
    "python-socketio>=5.12.0",
    "filetype>=1.2.0",
    "json5>=0.10.0",
    "python-datauri>=2.0.0",
    "ripgrep>=15.0.0",
    "anthropic>=0.49.0",
    "dashscope>=1.20.0",
    # ── OpenMox runtime ──
    "redis>=5.2.0",
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
# No package-mode — we use run.py to manage sys.path
package = false

[dependency-groups]
dev = [
    "fakeredis>=2.36.1",
]
